<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Привет</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #050a05;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }
    body::before {
      content: '';
      position: fixed;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      background: rgba(34,197,94,0.05);
      filter: blur(140px);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      animation: pulse 6s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.3; scale: 1; }
      50% { opacity: 1; scale: 1.3; }
    }
    h1 {
      position: relative;
      font-family: 'Inter', sans-serif;
      font-size: clamp(48px, 12vw, 110px);
      font-weight: 800;
      letter-spacing: -0.05em;
      line-height: 1;
      text-align: center;
      color: transparent;
      background: linear-gradient(135deg, #f472b6 0%, #c084fc 25%, #4ade80 50%, #22d3ee 75%, #f472b6 100%);
      background-size: 300% 300%;
      -webkit-background-clip: text;
      background-clip: text;
      animation: shift 6s ease-in-out infinite, breathe 5s ease-in-out infinite alternate;
    }
    h1::after {
      content: 'Привет, вонючка 💚';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, #f472b6, #c084fc, #4ade80, #22d3ee, #f472b6);
      background-size: 300% 300%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: blur(30px);
      opacity: 0;
      animation: shift 6s ease-in-out infinite, glow 5s ease-in-out infinite alternate;
    }
    @keyframes shift {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    @keyframes breathe {
      0%   { filter: drop-shadow(0 0 20px rgba(196,132,252,0.15)); }
      100% { filter: drop-shadow(0 0 70px rgba(74,222,128,0.35)); }
    }
    @keyframes glow {
      0%   { opacity: 0.15; }
      100% { opacity: 0.6; }
    }
  </style>
</head>
<body>
  <h1>Привет, вонючка 💚</h1>
</body>
</html>
